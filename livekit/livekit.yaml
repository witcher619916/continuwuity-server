port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: true
  enable_loopback_candidate: false
  interfaces:
    excludes:
      - docker0
      - CloudflareWARP

# API keys are not set here: they are passed in through the LIVEKIT_KEYS
# environment variable (see compose.yaml and secrets.enc.env)

# do not create rooms by default
room:
  auto_create: false
