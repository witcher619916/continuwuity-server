name: Syntax check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  syntax_check:
    runs-on: ubuntu-latest

    # The real values are SOPS-encrypted and only decrypted on the servers,
    # so give Compose (and Caddy) dummy values to check the files' structure
    env:
      TUNNEL_TOKEN: ci-dummy-token
      REDIS_PASSWORD: ci-dummy-password
      VPS_MESH_IP: 192.0.2.1
      LIVEKIT_KEY: ci-dummy-key
      LIVEKIT_SECRET: ci-dummy-secret

    steps:
      - uses: actions/checkout@v7

      - name: check server compose file
        run: docker compose config --quiet

      - name: check livekit compose file
        working-directory: livekit
        run: docker compose config --quiet

      - name: validate Caddyfile
        run: >
          docker compose run --rm --no-deps caddy
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
